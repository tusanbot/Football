services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: football_empire
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [football_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_empire"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [football_redis:/data]
volumes:
  football_postgres:
  football_redis:
