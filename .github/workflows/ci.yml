      - name: Test admin moderation RPC atomicity, audit and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-moderation-action-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin catalog toggle RPC atomicity, audit and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-catalog-toggle-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin catalog management RPC atomicity, audit and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-catalog-manage-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin entity update RPC atomicity, audit and access controls
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-entity-update-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin season award and broadcast creation RPC atomicity
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-season-award-and-broadcast-create-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin financial adjustment RPC atomicity, audit and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-financial-adjustment-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin finance summary RPC access and response shape
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-finance-summary-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin broadcast read RPC access and response shape
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-broadcast-read-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin broadcast retry RPC atomicity and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-broadcast-retry-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Build shared domain package
        run: pnpm --filter @football/domain build
      - name: Test Supabase HTTP admin console, moderation and broadcast repositories
        run: pnpm --filter @football/api exec tsx --test --test-concurrency=1 test/node-supabase-admin-console-read.test.ts test/node-supabase-admin-moderation-actions.test.ts test/node-supabase-admin-catalog-actions.test.ts test/node-supabase-admin-entity-update.test.ts test/node-supabase-admin-financial-adjustments.test.ts test/node-supabase-admin-broadcast-management.test.ts test/node-supabase-admin-season-awards.test.ts test/node-supabase-admin-broadcast-create.test.ts
      - name: Test Supabase HTTP match entrypoint repositories
        run: pnpm --filter @football/api exec tsx --test --test-concurrency=1 test/node-supabase-match-entrypoints.test.ts
      - name: Test Supabase match runtime coordination repositories
        run: pnpm --filter @football/api exec tsx --test --test-concurrency=1 test/node-supabase-match-runtime-coordination.test.ts
      - name: Test match worker Supabase service orchestration
        run: pnpm --filter @football/api exec tsx --test --test-concurrency=1 test/match-runtime-supabase-worker.test.ts
      - name: Test match worker Supabase checkpoint orchestration
        run: pnpm --filter @football/api exec tsx --test --test-concurrency=1 test/match-runtime-supabase-worker.test.ts
      - name: Test pyramid league notice list, claim, complete and retry RPCs
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/pyramid-league-notices-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test event tournament prize settlement and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/event-tournament-settlement-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test event tournament creation RPC and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/event-tournament-create-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test event tournament join, fees and automatic fixtures
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/event-tournament-join-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test event tournament admin role lookup RPC
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/event-tournament-admin-role-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test friendly challenge creation, billing, acceptance and idempotency RPCs
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/friendly-challenge-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test friendly match creation RPC and legacy lineup parity
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/friendly-match-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test invalid match runtime forfeit settlement and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/match-runtime-forfeit-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test atomic match settlement and competition advancement
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/match-settlement-advancement-atomic.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test isolated tournament finalization retry queues
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/tournament-finalization-retry-isolation.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin group broadcast delivery RPC locking, retry policy and grants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-group-broadcast-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test Node match notification RPC locking, retries and grants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/match-notification-node-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test Telegram message deletion queue RPC atomicity and retry policy
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/telegram-message-deletion-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test Bot runtime lease RPC concurrency and ownership
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/bot-runtime-lease-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test Telegram group registration and membership RPC
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/group-membership-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test Telegram group league lifecycle, membership and idempotency RPCs
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/group-league-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test alliance creation, invitations and treasury RPC
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/alliance-core-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test alliance workspace and season lifecycle RPC
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/alliance-season-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test multi-alliance competition invitations, season isolation and scoring
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/multi-alliance-competition-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin alliance season RPC audit and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-alliance-season-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Seed special-player catalog in ephemeral PostgreSQL
        run: pnpm --filter @football/api db:seed:special
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Verify seeded special-player catalog
        run: |
          pnpm --filter @football/api exec tsx -e 'import { createPrismaClient } from "./src/db.ts"; void (async () => { const prisma = createPrismaClient(); try { const count = await prisma.specialPlayer.count(); console.log(`Seeded special players: ${count}`); if (count !== 16) process.exitCode = 1; } finally { await prisma.$disconnect(); } })();'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Typecheck
        run: pnpm typecheck
      - name: Test Telegram Bot and webhook Worker
        run: pnpm --filter @football/bot test
      - name: Dry-run Cloudflare Bot webhook Worker bundle
        run: pnpm --dir apps/web exec wrangler deploy --dry-run --config ../bot/wrangler.jsonc
      - name: Test Cloudflare API Worker
        run: pnpm --dir cloudflare/api test
      - name: Typecheck Cloudflare API Worker
        run: pnpm --dir cloudflare/api typecheck
      - name: Bundle Cloudflare API Worker (dry run)
        run: pnpm --dir cloudflare/api check:worker
      - name: Validate production API Worker config (dry run)
        run: pnpm --dir cloudflare/api check:worker:production
      - name: Validate staging API Worker config (dry run)
        run: pnpm --dir cloudflare/api check:worker:staging
      - name: Build production-targeted Cloudflare Mini App Worker
        run: pnpm --dir apps/web build:worker:production
        env:
          NEXT_PUBLIC_API_URL: https://football-empire-api.mshmahyar9.workers.dev
      - name: Archive production Mini App Worker build
        uses: actions/upload-artifact@v4
        with:
          name: football-empire-miniapp-worker-production
          path: '**/.open-next/**'
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Build staging-targeted Cloudflare Mini App Worker
        run: pnpm --dir apps/web build:worker:staging
        env:
          NEXT_PUBLIC_API_URL: https://football-empire-api-staging.mshmahyar9.workers.dev
          NEXT_PUBLIC_BOT_WEBHOOK_URL: https://football-empire-bot-staging.mshmahyar9.workers.dev
      - name: Archive staging Mini App Worker build
        uses: actions/upload-artifact@v4
        with:
          name: football-empire-miniapp-worker-staging
          path: '**/.open-next/**'
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Test Cloudflare API Worker runtime
        run: pnpm exec tsx --test cloudflare/api/test/*.test.ts
      # D1 is an explicitly separate, incomplete migration track. PostgreSQL is
      # the authoritative runtime database, so D1 snapshot drift must not block
      # the PostgreSQL + Cloudflare compatibility release pipeline.
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Build Bot container image
        run: docker build -f apps/bot/Dockerfile -t football-empire-bot:ci .
      - name: Validate Bot compose configuration
        run: |
          cp .env.bot.example .env.bot
          docker compose -f docker-compose.bot.yml config --quiet
          rm .env.bot
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
