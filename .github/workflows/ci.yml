      - name: Test pyramid league application, queue assignment and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/pyramid-league-application-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test pyramid league overview read RPC
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/pyramid-league-overview-http-rpc.integration.sql
        env:
