      - name: Test pyramid league details read RPC
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/pyramid-league-details-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin pyramid league read RPC access and response
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-pyramid-league-read-http-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test admin pyramid league reports RPC access and response
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/admin-pyramid-league-reports-http-rpc.integration.sql
        env:
