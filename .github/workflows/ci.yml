name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main", "feat/supabase-http-full-runtime"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: football_empire
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_empire"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Validate Prisma schema
        run: pnpm --filter @football/api exec prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Prepare Supabase API roles for security migration tests
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF; END \$\$;"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Apply migrations to ephemeral PostgreSQL
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Verify public schema security
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/security-check.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test atomic action rate limit RPC
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/action-rate-limit-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test wallet RPC transaction and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/economy-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test competition creation RPC and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/competition-creation-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test competition read RPC access and response parity
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/competition-read-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test competition read, join and start RPC lifecycle
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/competition-lifecycle-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test club match history read RPC
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/club-match-read-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test competition advancement and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/competition-advancement-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test pyramid league settlement and promotion idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/pyramid-league-settlement-rpc.integration.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_empire
      - name: Test match runtime snapshot RPC and access controls
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/tests/match-runtime-snapshot-rpc.integration.sql
