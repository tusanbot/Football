name: Apply Football Empire database migrations

on:
  push:
    branches:
      - ops/database-migration-audit

permissions:
  contents: read

concurrency:
  group: football-empire-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Verify target and apply Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audited migration branch
        uses: actions/checkout@v4

      - name: Verify database target without printing credentials
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::DIRECT_URL repository secret is missing."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const url = new URL(process.env.DIRECT_URL);
          const expected = "rxdseowlyrryglticsuz";
          const username = decodeURIComponent(url.username);
          const hostMatches = url.hostname === `db.${expected}.supabase.co`;
          const userMatches = username.split(".").includes(expected);
          if (!hostMatches && !userMatches) {
            throw new Error("DIRECT_URL does not identify the verified Football Supabase project. No migration was executed.");
          }
          if (url.protocol !== "postgres:" && url.protocol !== "postgresql:") {
            throw new Error("DIRECT_URL is not a PostgreSQL connection URL.");
          }
          console.log("Database target verified against the confirmed Football project.");
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify migration set
        run: |
          set -euo pipefail
          count=$(find apps/api/prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql | wc -l)
          test "$count" -eq 39
          echo "Verified exactly 39 migration SQL files."

      - name: Generate Prisma Client
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm exec prisma generate

      - name: Apply all pending migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Verify migration status
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          pnpm exec prisma migrate status | tee ../../database-migrate-final-status.txt
          grep -Eiq "All migrations have been successfully applied|Database schema is up to date" ../../database-migrate-final-status.txt

      - name: Publish execution summary
        if: always()
        run: |
          {
            echo "## Football Empire database migration"
            echo
            echo "- Target project: `rxdseowlyrryglticsuz` (verified before execution)"
            echo "- Migration files expected: 39"
            echo "- Execution command: `prisma migrate deploy`"
            echo
            if [ -f database-migrate-final-status.txt ]; then
              echo '### Final Prisma status'
              cat database-migrate-final-status.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
