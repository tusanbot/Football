name: Deploy Football Empire to Telegram production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY_PRODUCTION to deploy both Cloudflare Workers and apply pending Prisma migrations
        required: true
        type: choice
        options:
          - NO
          - DEPLOY_PRODUCTION
        default: NO

permissions:
  contents: read

concurrency:
  group: football-empire-production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production == 'DEPLOY_PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL repository secret"; exit 1; }
          test -n "$DIRECT_URL" || { echo "Missing DIRECT_URL repository secret"; exit 1; }
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Build shared domain package
        run: pnpm --filter @football/domain build
      - name: Apply pending database migrations
        run: pnpm db:migrate:deploy
      - name: Ensure curated special-player catalog
        run: pnpm --filter @football/api db:seed:special
      - name: Deploy production API Worker
        run: pnpm --dir cloudflare/api exec wrangler deploy --config wrangler.production.jsonc
      - name: Verify production API readiness
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error https://football-empire-api.mshmahyar9.workers.dev/ready)"
          echo "$response" | jq -e '.status == "ready" and .database == "connected" and .schema == "current"'
      - name: Build production Mini App Worker
        run: pnpm --dir apps/web build:worker:production
        env:
          NEXT_PUBLIC_API_URL: https://football-empire-api.mshmahyar9.workers.dev
      - name: Deploy production Mini App Worker
        run: pnpm --dir apps/web exec wrangler deploy --config wrangler.production.jsonc
      - name: Verify Telegram Mini App origin
        shell: bash
        run: |
          status="$(curl --silent --show-error --output /tmp/football-miniapp.html --write-out '%{http_code}' https://football.mshmahyar9.workers.dev/)"
          test "$status" = "200"
          grep -qi '__next' /tmp/football-miniapp.html
