name: Deploy Football Empire staging API Worker

on:
  push:
    branches: ["feat/telegram-production-readiness"]
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: Type DEPLOY_STAGING_API to deploy only the isolated staging API Worker
        required: true
        type: choice
        options:
          - NO
          - DEPLOY_STAGING_API
        default: NO

permissions:
  contents: read

concurrency:
  group: football-empire-staging-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/feat/telegram-production-readiness' && ((github.event_name == 'workflow_dispatch' && inputs.confirm_staging == 'DEPLOY_STAGING_API') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-staging-api]')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout staging release branch
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build shared domain package
        run: pnpm --filter @football/domain build
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Deploy only the isolated staging API Worker
        run: pnpm --dir cloudflare/api exec wrangler deploy --config wrangler.staging.jsonc
      - name: Verify staging API and database health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            response="$(curl --silent --show-error https://football-empire-api-staging.mshmahyar9.workers.dev/ready || true)"
            if echo "$response" | jq -e '.status == "ready" and .database == "connected" and .schema == "current"' >/dev/null; then
              echo "Staging API is healthy."
              exit 0
            fi
            if echo "$response" | jq -e '.reason == "HYPERDRIVE_DAILY_LIMIT"' >/dev/null; then
              echo "Hyperdrive daily query quota is exhausted; retry after the reported reset time."
              echo "$response"
              exit 1
            fi
            sleep 3
          done
          echo "Staging API did not become healthy."
          echo "$response"
          exit 1
      # This workflow intentionally does not rotate secrets, change vars,
      # deploy the Mini App, deploy the Bot, or register/modify the Telegram webhook.
