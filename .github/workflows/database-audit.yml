name: Database Read-only Audit

on:
  push:
    branches:
      - ops/database-migration-audit
  workflow_dispatch:
    inputs:
      acknowledge_read_only:
        description: Confirm that this workflow only inspects the database and never applies migrations
        required: true
        type: choice
        options:
          - READ_ONLY_AUDIT_ONLY

permissions:
  contents: read

concurrency:
  group: football-database-read-only-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Inspect PostgreSQL migration state (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce read-only invocation
        env:
          ACKNOWLEDGEMENT: ${{ inputs.acknowledge_read_only }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "$ACKNOWLEDGEMENT" = "READ_ONLY_AUDIT_ONLY"
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::Repository secret DIRECT_URL is not configured. Add a PostgreSQL direct-endpoint or Supabase session-mode pooler connection string as the GitHub Actions secret DIRECT_URL. Its value will not be printed."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Inspect database catalog and Prisma migration history
        working-directory: apps/api
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: node scripts/database-audit.mjs

      - name: Validate Prisma schema (no database changes)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm exec prisma validate

      - name: Verify audit report state semantics
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("database-audit.json", "utf8"));
          const statusFields = [
            "applied_migrations",
            "pending_migrations",
            "failed_or_rolled_back_migrations",
          ];
          if (report.migration_history_table_exists) {
            for (const field of statusFields) {
              if (!Array.isArray(report[field])) {
                throw new Error(`Expected ${field} to be an array when migration history exists`);
              }
            }
            if (!Array.isArray(report.history_rows)) {
              throw new Error("Expected history_rows to be an array when migration history exists");
            }
          } else {
            for (const field of [...statusFields, "history_rows"]) {
              if (report[field] !== null) {
                throw new Error(`Expected ${field} to be null when migration history is absent`);
              }
            }
          }
          if (report.safety?.schema_changes_executed !== false ||
              report.safety?.migrations_executed !== false) {
            throw new Error("Audit safety invariants are not satisfied");
          }
          console.log("Audit report semantics and read-only safety invariants verified.");
          NODE

      - name: Check Prisma migration status (read-only)
        id: migration_status
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set +e
          pnpm --filter @football/api exec prisma migrate status > database-migrate-status.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat database-migrate-status.txt
          exit 0

      - name: Generate schema difference SQL without executing it
        id: schema_diff
        continue-on-error: true
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set +e
          pnpm exec prisma migrate diff \
            --from-url "$DIRECT_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > ../../database-schema-diff.sql 2> ../../database-schema-diff.stderr
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "Prisma schema diff completed with exit code: $status"
          exit 0

      - name: Verify generated schema diff and safety
        run: |
          set -euo pipefail
          test "${{ steps.schema_diff.outputs.exit_code }}" = "0"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const sql = readFileSync("database-schema-diff.sql", "utf8");
          const required = [
            "AllianceSeason_allianceId_fkey",
            "AllianceLedger_allianceId_fkey",
          ];
          for (const constraint of required) {
            if (!sql.includes(constraint)) {
              throw new Error(`Generated Prisma diff is missing ${constraint}`);
            }
          }
          const destructive = /\\b(?:DROP\\s+TABLE|DROP\\s+COLUMN|DELETE\\s+FROM|TRUNCATE(?:\\s+TABLE)?)\\b/i;
          if (destructive.test(sql)) {
            throw new Error("Generated Prisma diff contains a destructive table/column/data operation; manual review is required.");
          }
          console.log("Generated schema diff includes both Alliance foreign keys and no DROP TABLE/COLUMN, DELETE, or TRUNCATE operations.");
          NODE

      - name: Add audit outcome to workflow summary
        if: always()
        run: |
          {
            echo "## Football Empire database audit"
            echo
            echo "- Mode: **read-only**"
            echo "- Migration execution: **not performed**"
            echo "- Prisma migrate status exit code: ${{ steps.migration_status.outputs.exit_code || 'not run' }}"
            echo "- Prisma schema diff exit code: ${{ steps.schema_diff.outputs.exit_code || 'not run' }}"
            echo
            if [ -f database-audit.md ]; then cat database-audit.md; fi
            echo
            echo "The generated SQL diff is a report only. It has not been executed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-database-read-only-audit
          if-no-files-found: warn
          retention-days: 14
          path: |
            database-audit.json
            database-audit.md
            database-migrate-status.txt
            database-schema-diff.sql
            database-schema-diff.stderr
