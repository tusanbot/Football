name: Deploy Football Empire staging

on:
  push:
    branches: ["feat/telegram-production-readiness"]
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: Type DEPLOY_STAGING to deploy only the isolated staging Workers (never production)
        required: true
        type: choice
        options:
          - NO
          - DEPLOY_STAGING
        default: NO

permissions:
  contents: read

concurrency:
  group: football-empire-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/feat/telegram-production-readiness' && ((github.event_name == 'workflow_dispatch' && inputs.confirm_staging == 'DEPLOY_STAGING') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-staging]')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      STAGING_GAME_ADMIN_TELEGRAM_IDS: ${{ secrets.STAGING_GAME_ADMIN_TELEGRAM_IDS }}
    steps:
      - name: Checkout staging release branch
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify staging-only credentials and database target
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_TELEGRAM_BOT_TOKEN STAGING_GAME_ADMIN_TELEGRAM_IDS; do
            test -n "${!key}" || { echo "Missing required repository secret: $key"; exit 1; }
          done
          [[ "$STAGING_TELEGRAM_BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]{20,}$ ]] || { echo "Invalid staging Bot token format"; exit 1; }
          [[ "$STAGING_GAME_ADMIN_TELEGRAM_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "STAGING_GAME_ADMIN_TELEGRAM_IDS must be comma-separated numeric Telegram IDs"; exit 1; }
      - name: Generate isolated staging secrets
        shell: bash
        run: |
          set -euo pipefail
          STAGING_BOT_API_SECRET="$(openssl rand -hex 32)"
          STAGING_TELEGRAM_WEBHOOK_SECRET="$(openssl rand -hex 32)"
          STAGING_ANALYTICS_HASH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$STAGING_BOT_API_SECRET"
          echo "::add-mask::$STAGING_TELEGRAM_WEBHOOK_SECRET"
          echo "::add-mask::$STAGING_ANALYTICS_HASH_SECRET"
          {
            echo "STAGING_BOT_API_SECRET=$STAGING_BOT_API_SECRET"
            echo "STAGING_TELEGRAM_WEBHOOK_SECRET=$STAGING_TELEGRAM_WEBHOOK_SECRET"
            echo "STAGING_ANALYTICS_HASH_SECRET=$STAGING_ANALYTICS_HASH_SECRET"
          } >> "$GITHUB_ENV"
      - name: Build shared domain package
        run: pnpm --filter @football/domain build
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Build shared domain package
        run: pnpm --filter @football/domain build
      # Staging SQL and Prisma migration history are already applied and verified
      # through the Supabase management connection. The GitHub runner does not
      # need direct PostgreSQL connectivity; the deployed API uses staging Hyperdrive.
      - name: Deploy isolated staging API Worker
        run: pnpm --dir cloudflare/api exec wrangler deploy --config wrangler.staging.jsonc
      - name: Configure staging API secrets
        shell: bash
        run: |
          printf '%s' "$STAGING_TELEGRAM_BOT_TOKEN" | pnpm --dir cloudflare/api exec wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.staging.jsonc
          printf '%s' "$STAGING_BOT_API_SECRET" | pnpm --dir cloudflare/api exec wrangler secret put BOT_API_SECRET --config wrangler.staging.jsonc
          printf '%s' "$STAGING_GAME_ADMIN_TELEGRAM_IDS" | pnpm --dir cloudflare/api exec wrangler secret put GAME_ADMIN_TELEGRAM_IDS --config wrangler.staging.jsonc
      - name: Verify staging API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            response="$(curl --silent --show-error https://football-empire-api-staging.mshmahyar9.workers.dev/ready || true)"
            if echo "$response" | jq -e '.status == "ready" and .database == "connected" and .schema == "current"' >/dev/null; then
              echo "Staging API is ready."
              exit 0
            fi
            sleep 3
          done
          echo "Staging API did not become ready."
          echo "$response"
          exit 1
      - name: Build staging Mini App Worker
        run: pnpm --dir apps/web build:worker:staging
        env:
          NEXT_PUBLIC_API_URL: https://football-empire-api-staging.mshmahyar9.workers.dev
          NEXT_PUBLIC_BOT_WEBHOOK_URL: https://football-empire-bot-staging.mshmahyar9.workers.dev
      - name: Deploy staging Mini App Worker
        run: pnpm --dir apps/web exec wrangler deploy --config wrangler.staging.jsonc
      - name: Deploy isolated staging Bot webhook Worker
        run: pnpm --dir apps/bot exec wrangler deploy --config wrangler.jsonc
      - name: Configure staging Bot Worker secrets
        shell: bash
        run: |
          printf '%s' "$STAGING_TELEGRAM_BOT_TOKEN" | pnpm --dir apps/bot exec wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.jsonc
          printf '%s' "$STAGING_TELEGRAM_WEBHOOK_SECRET" | pnpm --dir apps/bot exec wrangler secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.jsonc
          printf '%s' "$STAGING_BOT_API_SECRET" | pnpm --dir apps/bot exec wrangler secret put BOT_API_SECRET --config wrangler.jsonc
          printf '%s' "$STAGING_ANALYTICS_HASH_SECRET" | pnpm --dir apps/bot exec wrangler secret put ANALYTICS_HASH_SECRET --config wrangler.jsonc
      - name: Verify staging Mini App and Bot Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://football-empire-web-staging.mshmahyar9.workers.dev/ -o /tmp/football-miniapp.html
          grep -qi '__next' /tmp/football-miniapp.html
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://football-empire-bot-staging.mshmahyar9.workers.dev/health)" = "200"
          echo "Staging Mini App and Bot Worker are deployed and healthy. Telegram webhook registration was intentionally not performed."
