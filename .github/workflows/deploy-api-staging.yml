name: Deploy Football Empire API staging only

on:
  push:
    branches:
      - feat/supabase-transaction-pooler-runtime
      - feat/supabase-http-full-runtime

permissions:
  contents: read

concurrency:
  group: football-empire-api-staging-only
  cancel-in-progress: false

# This workflow deploys only the isolated API staging Worker. It never touches
# production, Mini App Workers, Bot Workers, DNS, webhooks, or database migrations.
jobs:
  deploy-api:
    if: contains(github.event.head_commit.message, '[deploy-staging-api]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout verified feature branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify staging deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build shared domain package
        run: pnpm --filter @football/domain build

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck API Worker
        run: pnpm --dir cloudflare/api typecheck

      - name: Dry-run isolated staging API Worker
        run: pnpm --dir cloudflare/api exec wrangler deploy --dry-run --config wrangler.staging.jsonc

      - name: Deploy API Worker to staging only
        run: pnpm --dir cloudflare/api exec wrangler deploy --config wrangler.staging.jsonc

      - name: Verify staging API database readiness
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --max-time 12 https://football-empire-api-staging.mshmahyar9.workers.dev/ready || true)"
          if echo "$response" | jq -e '.status == "ready" and .database == "connected" and .schema == "current"' >/dev/null; then
            echo "Staging API is connected to Supabase and schema checks passed."
            exit 0
          fi
          echo "Staging API readiness failed:"
          echo "$response"
          exit 1
