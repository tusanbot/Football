name: Apply Football Prisma Migrations

on:
  push:
    branches:
      - ops/database-migration-audit
    paths:
      - .github/workflows/apply-football-migrations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-prisma-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify Football schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: database-migrations
    steps:
      - name: Checkout audited migration branch
        uses: actions/checkout@v4
        with:
          ref: ops/database-migration-audit

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate target database and clean initial schema
        working-directory: apps/api
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          EXPECTED_PROJECT_REF: rxdseowlyrryglticsuz
        run: |
          set -euo pipefail
          test -n "$DIRECT_URL"
          node --input-type=module <<'NODE'
          import pg from "pg";
          const url = new URL(process.env.DIRECT_URL);
          const expected = process.env.EXPECTED_PROJECT_REF;
          const username = decodeURIComponent(url.username);
          const hostMatches = url.hostname === `db.${expected}.supabase.co`;
          const poolerMatches = url.hostname.endsWith(".pooler.supabase.com") && username.endsWith(`.${expected}`);
          if (!hostMatches && !poolerMatches) {
            throw new Error("DIRECT_URL does not identify the approved Supabase project; refusing to migrate.");
          }
          const client = new pg.Client({ connectionString: process.env.DIRECT_URL, ssl: { rejectUnauthorized: false } });
          await client.connect();
          try {
            const r = await client.query(`
              SELECT current_database() AS database_name,
                (SELECT count(*)::int FROM information_schema.tables
                 WHERE table_schema='public' AND table_type='BASE TABLE') AS public_tables,
                to_regclass('public."_prisma_migrations"') IS NOT NULL AS prisma_history_exists
            `);
            const row = r.rows[0];
            if (row.database_name !== "postgres" || row.public_tables !== 0 || row.prisma_history_exists) {
              throw new Error("Pre-migration state differs from the audited empty Football schema; refusing to migrate.");
            }
            console.log(JSON.stringify({ project_ref: expected, database: row.database_name, public_tables: row.public_tables, prisma_history_exists: row.prisma_history_exists }));
          } finally {
            await client.end();
          }
          NODE

      - name: Validate Prisma schema and migration set
        working-directory: apps/api
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          test "$(find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql | wc -l | tr -d ' ')" = "39"
          pnpm exec prisma validate

      - name: Apply all pending Prisma migrations
        working-directory: apps/api
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Verify migration history, tables, and critical foreign keys
        working-directory: apps/api
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EXPECTED_MIGRATIONS: "39"
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DIRECT_URL, ssl: { rejectUnauthorized: false } });
          await client.connect();
          try {
            const history = await client.query('SELECT migration_name, finished_at, rolled_back_at FROM public."_prisma_migrations" ORDER BY started_at');
            const tables = await client.query("SELECT count(*)::int AS n FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'");
            const fks = await client.query(`
              SELECT conname FROM pg_constraint
              WHERE conname IN ('AllianceSeason_allianceId_fkey','AllianceLedger_allianceId_fkey')
                AND contype='f'
            `);
            const failed = history.rows.filter(x => !x.finished_at || x.rolled_back_at);
            if (history.rows.length !== Number(process.env.EXPECTED_MIGRATIONS) || failed.length || Number(tables.rows[0].n) < 50 || fks.rows.length !== 2) {
              throw new Error(JSON.stringify({ migrations: history.rows.length, failed: failed.map(x=>x.migration_name), public_tables: tables.rows[0].n, alliance_fks: fks.rows.map(x=>x.conname) }));
            }
            console.log(JSON.stringify({ successful_migrations: history.rows.length, public_tables: tables.rows[0].n, alliance_foreign_keys: fks.rows.map(x=>x.conname) }));
          } finally {
            await client.end();
          }
          NODE
